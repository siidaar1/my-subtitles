<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Saved videos</title>
<style>
  :root{
    --paper:#f3f6f4; --ink:#17231f; --muted:#5d6f68; --line:#cdd9d3;
    --accent:#0f6b5a; --err:#b3261e; --run:#b7791f; --card:#ffffff;
    /* subtitle style (changed by the panel under the video) */
    --sub-scale:1; --sub-color:#5aa9ff; --sub-bg:rgba(0,0,0,.62); --sub-radius:6px;
    --sub-font:system-ui,sans-serif; --sub-weight:600; --sub-shadow:none; --sub-lift:0px;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#101916; --ink:#e6efeb; --muted:#93a8a0; --line:#2a3b35; --accent:#4fc3a8; --err:#ff8a80; --run:#f0b35a; --card:#17231f;}
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
  body.noscroll{overflow:hidden}
  main{max-width:860px;margin:0 auto;padding:40px 20px 80px}
  h1{font-size:2rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:1.15rem;line-height:1.35;margin:0 0 12px}
  p.sub{margin:0 0 28px;color:var(--muted)}
  input,button{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
  button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer;font-weight:600;touch-action:manipulation}
  button.ghost{background:var(--card);color:var(--ink)}
  :focus-visible{outline:3px solid var(--run);outline-offset:2px}
  #msg,#vmsg{color:var(--err);font-family:system-ui,sans-serif;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{display:block;width:100%;text-align:left;padding:0;overflow:hidden;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;font-weight:400;text-decoration:none}
  .card:hover{border-color:var(--accent)}
  .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
  .card .ct{padding:10px 12px 12px}
  .card .ti{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{font:.8rem/1.5 system-ui,sans-serif;color:var(--muted);margin-top:4px}
  .card .bad{color:var(--err)}
  details{margin-top:28px;font-family:system-ui,sans-serif;font-size:.92rem;color:var(--muted)}
  details input{width:min(420px,100%);margin:8px 8px 0 0}
  .bar{display:flex;gap:12px;align-items:center;margin:10px 0 14px;flex-wrap:wrap}
  #playerMsg{font:.9rem system-ui,sans-serif;color:var(--err)}

  /* ---- player stage ---- */
  #stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;container-type:inline-size}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #stage:fullscreen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}
  #stage:-webkit-full-screen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}
  #stage.isfs{aspect-ratio:auto;border-radius:0}

  /* subtitles: always anchored to the BOTTOM of the video */
  #sub{display:none;position:absolute;left:50%;top:auto;transform:translateX(-50%);
    bottom:calc(clamp(40px,9cqw,90px) + var(--sub-lift));z-index:2;
    max-width:92%;text-align:center;pointer-events:none;color:var(--sub-color);background:var(--sub-bg);
    padding:.15em .6em;border-radius:var(--sub-radius);
    font-family:var(--sub-font);font-weight:var(--sub-weight);line-height:1.4;text-shadow:var(--sub-shadow);
    font-size:calc(clamp(12px,2.6cqw,17px) * var(--sub-scale));
    overflow-wrap:anywhere}
  #stage.isfs #sub{font-size:calc(clamp(15px,2.4cqw,34px) * var(--sub-scale));
    bottom:calc(clamp(44px,7cqw,120px) + var(--sub-lift));max-width:88%}

  /* subtitle style panel */
  #styler{margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 14px;
    font-family:system-ui,sans-serif;font-size:.92rem;color:var(--ink)}
  #styler summary{cursor:pointer;padding:12px 0;font-weight:600}
  #styler .ctl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px;padding-bottom:14px}
  #styler label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.82rem}
  #styler label b{color:var(--ink);font-weight:600}
  #styler input{width:100%;margin:0}
  #styler input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:32px}
  #styler input[type=color]{height:38px;padding:2px;cursor:pointer}
  #styler select{width:100%;margin:0;padding:9px 10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
  #styler .prev{display:flex;justify-content:center;align-items:flex-end;min-height:84px;padding:14px;margin:0 0 14px;border-radius:6px;
    background:linear-gradient(135deg,#2b3a55,#6b7f99 55%,#3c4a3a)}
  #subPreviewText{max-width:100%;text-align:center;padding:.15em .6em;color:var(--sub-color);background:var(--sub-bg);
    border-radius:var(--sub-radius);font-family:var(--sub-font);font-weight:var(--sub-weight);line-height:1.4;text-shadow:var(--sub-shadow);
    font-size:calc(16px * var(--sub-scale));overflow-wrap:anywhere}
  #styler .row{display:flex;justify-content:flex-end;padding-bottom:14px}

  /* small exit button, top right, only while in full screen */
  #exitFs{display:none;position:absolute;z-index:5;
    top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
    width:38px;height:38px;padding:0;border-radius:50%;
    align-items:center;justify-content:center;font:700 18px/1 system-ui,sans-serif;
    background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.55)}
  #stage.isfs #exitFs{display:flex}

  /* fallback full screen (iPhone Safari cannot full-screen a custom element) */
  #stage.pfs{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;height:100dvh;margin:0}
  @media (orientation:portrait){
    #stage.pfs{inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;
      transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
  }

  .tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
  .tabs button{background:var(--card);color:var(--ink)}
  .tabs button[aria-pressed=true]{background:var(--accent);color:#fff}
  #text{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 18px;max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--card);text-align:left;font:600 .85rem system-ui,sans-serif;color:var(--muted);padding:10px 8px;border-bottom:2px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
  td.t{width:76px;white-space:nowrap;font:.9rem system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--accent)}
  tr:last-child td{border-bottom:0}

  /* ---- mobile ---- */
  @media (max-width:640px){
    main{padding:20px 12px 60px}
    h1{font-size:1.5rem}
    h2{font-size:1.05rem}
    p.sub{margin-bottom:18px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .card .ti{font-size:.92rem}
    #back{width:100%}
    .bar{flex-direction:column;align-items:stretch;gap:8px}
    .bar button{width:100%;padding:12px 14px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tabs button{padding:12px 8px}
    #text{padding:4px 10px;max-height:50vh}
    td.t{width:60px;font-size:.8rem}
    td{font-size:.95rem}
    #sub{bottom:calc(clamp(34px,11cqw,60px) + var(--sub-lift));font-size:calc(clamp(12px,3.4cqw,15px) * var(--sub-scale));max-width:94%}
    #styler .ctl-grid{grid-template-columns:1fr 1fr;gap:10px 12px}
    #styler .row button{width:100%}
    details input{width:100%;margin-right:0}
    details button{margin-top:8px}
  }
</style>
</head>
<body>
<main>
  <h1>Saved videos</h1>
  <p class="sub" id="source"></p>

  <div id="listPanel">
    <p id="msg" role="alert"></p>
    <div class="grid" id="list"></div>
    <details id="tokenBox">
      <summary>Private repository, or “rate limit” message?</summary>
      <p>Paste a read-only GitHub token (fine-grained, Contents: Read-only). It is stored only in this browser.</p>
      <input type="password" id="token" placeholder="github_pat_…" autocomplete="off" aria-label="GitHub read-only token">
      <button type="button" id="saveToken">Save and reload</button>
      <button type="button" id="clearToken" class="ghost">Remove token</button>
    </details>
  </div>

  <section id="viewer" hidden>
    <button type="button" id="back" class="ghost" style="margin-bottom:14px">Back to saved videos</button>
    <h2 id="vtitle" dir="auto"></h2>
    <p id="vmsg" role="alert"></p>
    <div id="stage">
      <div id="sub" dir="auto"></div>
      <button type="button" id="exitFs" aria-label="Exit full screen" title="Exit full screen">✕</button>
    </div>
    <div class="bar">
      <button type="button" id="fs">Full screen with subtitles</button>
      <span id="playerMsg" role="alert"></span>
    </div>
    <details id="styler">
      <summary>Subtitle style: size, color, shape, font…</summary>
      <div class="prev"><span id="subPreviewText" dir="auto">Sample subtitle · نموذج الترجمة</span></div>
      <div class="ctl-grid">
        <label><span>Text size <b id="vSize"></b></span>
          <input type="range" id="sSize" min="60" max="300" step="5"></label>
        <label><span>Raise from bottom <b id="vLift"></b></span>
          <input type="range" id="sLift" min="-20" max="200" step="2"></label>
        <label><span>Text color</span>
          <input type="color" id="sColor"></label>
        <label><span>Background color</span>
          <input type="color" id="sBg"></label>
        <label><span>Background opacity <b id="vBga"></b></span>
          <input type="range" id="sBga" min="0" max="100" step="5"></label>
        <label><span>Shape</span>
          <select id="sShape">
            <option value="0px">Square</option>
            <option value="6px">Rounded</option>
            <option value="18px">Very rounded</option>
          </select></label>
        <label><span>Font</span>
          <select id="sFont">
            <option value="system-ui, sans-serif">Sans-serif</option>
            <option value="Georgia, 'Times New Roman', serif">Serif</option>
            <option value="ui-monospace, Menlo, Consolas, monospace">Monospace</option>
            <option value="Tahoma, 'Segoe UI', Arial, sans-serif">Tahoma</option>
            <option value="'Noto Naskh Arabic', 'Traditional Arabic', 'Geeza Pro', serif">Arabic Naskh</option>
            <option value="'Comic Sans MS', 'Chalkboard SE', cursive">Casual</option>
          </select></label>
        <label><span>Weight</span>
          <select id="sWeight">
            <option value="400">Normal</option>
            <option value="600">Semi-bold</option>
            <option value="800">Bold</option>
          </select></label>
        <label><span>Text effect</span>
          <select id="sEffect">
            <option value="none">None</option>
            <option value="shadow">Shadow</option>
            <option value="outline">Black outline</option>
            <option value="glow">Glow</option>
          </select></label>
      </div>
      <div class="row"><button type="button" id="sReset" class="ghost">Reset to default</button></div>
    </details>
    <div class="tabs">
      <button type="button" data-view="translated" aria-pressed="true">Translated</button>
      <button type="button" data-view="original" aria-pressed="false">Original</button>
      <button type="button" id="copy">Copy text</button>
      <button type="button" id="srt">Download .srt</button>
    </div>
    <div id="text"></div>
  </section>
</main>

<script>
// ============ SETTINGS: change these 3 lines ============
const CFG = {
  repo: "",   // the GitHub repo that holds the "saved" folder, e.g. "ali/my-subtitles".
                                 // Use "" if this page is hosted from that same repo (GitHub Pages).
  branch: "main",
  folder: "saved",
};
// =========================================================
// You can also open the page as  saved_page.html?repo=ali/my-subtitles

const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
if (q.get("repo")) CFG.repo = q.get("repo");
if (q.get("branch")) CFG.branch = q.get("branch");

function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function lsSet(k, v){ try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }

let items = [], data = null, view = "translated", videoUrl = "", player = null, ytReady = null, subTimer = null;

// ---------- reading from GitHub (or from the same site) ----------
async function getJSON(path){
  const clean = path.split("/").map(encodeURIComponent).join("/");
  let r;
  if (!CFG.repo){
    r = await fetch("./" + clean + "?t=" + Date.now());
  } else {
    const headers = {"Accept": "application/vnd.github.raw+json"};
    const tok = lsGet("gh_token"); if (tok) headers["Authorization"] = "Bearer " + tok;
    r = await fetch("https://api.github.com/repos/" + CFG.repo + "/contents/" + clean + "?ref=" + encodeURIComponent(CFG.branch), {headers});
  }
  if (!r.ok){ const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();
}
function explain(e, what){
  if (e.status === 404) return "Could not find " + what + " in " + (CFG.repo || "this site") + ". Check the repo name and branch, make sure something was uploaded, or add a token below if the repo is private.";
  if (e.status === 401) return "GitHub did not accept the token. Save a new one below.";
  if (e.status === 403) return "GitHub refused the request, most likely the limit for anonymous visitors (60 per hour). Try again later or add a token below.";
  return "Could not load " + what + ": " + e.message;
}

// ---------- list ----------
function render(list){
  const box = $("#list"); box.textContent = "";
  if (!list.length){ $("#msg").textContent = "Nothing saved yet."; return; }
  for (const it of list){
    const a = document.createElement("a"); a.className = "card"; a.href = "#" + encodeURIComponent(it.id);
    if (it.video_id){
      const img = document.createElement("img"); img.loading = "lazy"; img.alt = "";
      img.src = "https://i.ytimg.com/vi/" + it.video_id + "/mqdefault.jpg"; img.onerror = () => img.remove();
      a.append(img);
    }
    const ct = document.createElement("div"); ct.className = "ct";
    const ti = document.createElement("div"); ti.className = "ti"; ti.dir = "auto"; ti.textContent = it.title || it.url;
    const m1 = document.createElement("div"); m1.className = "meta"; m1.textContent = it.language + ", " + it.lines + " lines";
    const m2 = document.createElement("div"); m2.className = "meta"; m2.textContent = (it.created || "").replace("T", " ");
    ct.append(ti, m1, m2);
    if (!it.translated){
      const m3 = document.createElement("div"); m3.className = "meta bad"; m3.textContent = "Translation failed, original only"; ct.append(m3);
    }
    a.append(ct); box.append(a);
  }
}
async function loadList(){
  $("#msg").textContent = "";
  if (CFG.repo.includes("YOUR-")){
    $("#msg").textContent = "Set your repository first: edit CFG.repo at the top of this file, or open this page as saved_page.html?repo=owner/name";
    return;
  }
  try { items = await getJSON(CFG.folder + "/index.json"); render(items); }
  catch (e){ $("#msg").textContent = explain(e, CFG.folder + "/index.json"); $("#tokenBox").open = [401, 403, 404].includes(e.status); }
}

// ---------- one video ----------
function setView(v){
  view = v;
  document.querySelectorAll(".tabs [data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === v));
}
function paintTable(){
  const box = $("#text"); box.textContent = "";
  const table = document.createElement("table");
  const head = table.createTHead().insertRow();
  for (const h of ["Time", view === "translated" ? "Translation" : "Original"]){
    const th = document.createElement("th"); th.textContent = h; head.append(th);
  }
  const body = table.createTBody();
  for (const l of data[view]){
    const tr = body.insertRow();
    const t = tr.insertCell(); t.className = "t"; t.textContent = l.time;
    const x = tr.insertCell(); x.textContent = l.text; x.dir = "auto";
  }
  box.append(table);
}
async function openItem(id){
  $("#listPanel").hidden = true; $("#viewer").hidden = false;
  $("#vmsg").textContent = ""; $("#vtitle").textContent = ""; stopPlayer(); data = null; $("#text").textContent = "";
  try { data = await getJSON(CFG.folder + "/" + id + "/data.json"); }
  catch (e){ $("#vmsg").textContent = explain(e, "this video"); return; }
  videoUrl = data.url || "";
  setView(data.translated && data.translated.length ? "translated" : "original");
  $("#vtitle").textContent = data.title || "";
  document.title = (data.title || "Saved video") + " - Saved videos";
  paintTable(); showPlayer();
}
function showList(){
  stopPlayer(); data = null; document.title = "Saved videos";
  $("#viewer").hidden = true; $("#listPanel").hidden = false;
}
function route(){
  let id = ""; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (id) openItem(id); else showList();
}
window.addEventListener("hashchange", route);
$("#back").addEventListener("click", () => { location.hash = ""; });

// ---------- player with blue subtitles ----------
function videoId(u){
  const m = (u || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function loadYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    if (window.YT && YT.Player) return res();
    const fail = () => { ytReady = null; rej(new Error("YouTube script not loaded")); };
    const timer = setTimeout(fail, 10000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); res(); };
    const sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api"; sc.onerror = () => { clearTimeout(timer); fail(); };
    document.head.append(sc);
  });
  return ytReady;
}
function say(text, withLink){
  const msg = $("#playerMsg"); msg.textContent = text;
  if (withLink){
    const a = document.createElement("a");
    a.href = videoUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = " Open it on YouTube";
    msg.append(a);
  }
}
function onPlayerError(e){
  const code = e && e.data;
  const why = {2:"The video link is not valid.", 5:"The player had an HTML5 error.", 100:"The video was not found or is private.",
    101:"The owner of this video blocks embedding.", 150:"The owner of this video blocks embedding.",
    153:"YouTube rejected this page as the embed source. Host the page on a normal https address (not a local file)."}[code] || "The video could not be played.";
  say(why + " (error " + code + ")", true);
}
function makeFrame(id){
  const f = document.createElement("iframe");
  f.title = "Video with translated subtitles";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  let src = "https://www.youtube.com/embed/" + id + "?enablejsapi=1&rel=0&fs=0&playsinline=1";
  if (location.protocol.startsWith("http")) src += "&origin=" + encodeURIComponent(location.origin);
  f.src = src;
  $("#stage").insertBefore(f, $("#stage").firstChild);
  return f;
}
async function showPlayer(){
  say("");
  const id = videoId(videoUrl);
  if (!id){ say("Could not read the video ID from the saved link."); return; }
  clearInterval(subTimer); player = null;
  const old = $("#stage iframe"); if (old) old.remove();
  const frame = makeFrame(id);
  try { await loadYT(); }
  catch (err){ say("The video is shown, but subtitles are off: YouTube’s player script could not load.", true); return; }
  player = new YT.Player(frame, {events:{onError:onPlayerError}});
  subTimer = setInterval(tickSub, 200);
}
function stopPlayer(){
  exitFs();
  clearInterval(subTimer); player = null;
  const old = $("#stage iframe"); if (old) old.remove();
  $("#sub").style.display = "none";
}
function toSec(t){ const p = t.split(":").map(Number); return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1]; }
function cueList(){ return (data.translated && data.translated.length) ? data.translated : data.original; }
function tickSub(){
  if (!player || !player.getCurrentTime || !data) return;
  const t = player.getCurrentTime(), list = cueList();
  let text = "";
  for (let i = list.length - 1; i >= 0; i--){
    if (!list[i].time) continue;
    const s = toSec(list[i].time);
    if (s <= t){
      const next = list.slice(i + 1).find(x => x.time);
      const e = next ? toSec(next.time) : s + 4;
      if (t < e) text = list[i].text;
      break;
    }
  }
  const el = $("#sub");
  if (el.textContent !== text) el.textContent = text;
  el.style.display = text ? "block" : "none";
}

// ---------- full screen (rotates to landscape on phones) ----------
const stage = $("#stage");
function nativeFsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
function inFs(){ return !!nativeFsEl() || stage.classList.contains("pfs"); }
function syncFsUi(){
  stage.classList.toggle("isfs", inFs());
}
function lockLandscape(){
  try {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
  } catch (e) {}
}
function unlockOrientation(){
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
}
async function enterFs(){
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (req){
    try {
      await req.call(stage);
      lockLandscape();          // turns the phone view sideways when the browser allows it
      syncFsUi();
      return;
    } catch (e) { /* fall through to the CSS version */ }
  }
  // Fallback (iPhone Safari): cover the screen with the player, turned sideways if the phone is upright
  stage.classList.add("pfs");
  document.body.classList.add("noscroll");
  syncFsUi();
}
function exitFs(){
  const wasFs = inFs();
  if (nativeFsEl()){
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    try { const p = ex && ex.call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  stage.classList.remove("pfs");
  document.body.classList.remove("noscroll");
  if (wasFs) unlockOrientation();
  syncFsUi();
}
function onFsChange(){
  if (!nativeFsEl() && !stage.classList.contains("pfs")) unlockOrientation();
  syncFsUi();
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);
document.addEventListener("keydown", e => { if (e.key === "Escape" && stage.classList.contains("pfs")) exitFs(); });
$("#fs").addEventListener("click", () => { inFs() ? exitFs() : enterFs(); });
$("#exitFs").addEventListener("click", exitFs);

// ---------- subtitle style panel ----------
const STYLE_DEFAULT = {size:100, lift:0, color:"#5aa9ff", bg:"#000000", bga:62,
  shape:"6px", font:"system-ui, sans-serif", weight:"600", effect:"none"};
const EFFECTS = {
  none:"none",
  shadow:"0 2px 5px rgba(0,0,0,.95)",
  outline:"-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 3px #000",
  glow:"0 0 6px currentColor, 0 0 12px currentColor"
};
const CTL = {sSize:"size", sLift:"lift", sColor:"color", sBg:"bg", sBga:"bga",
  sShape:"shape", sFont:"font", sWeight:"weight", sEffect:"effect"};
const NUM = new Set(["size", "lift", "bga"]);
let sty = Object.assign({}, STYLE_DEFAULT);
try { Object.assign(sty, JSON.parse(lsGet("sub_style") || "{}")); } catch (e) {}

function hexRgba(h, a){
  const m = /^#?([0-9a-f]{6})$/i.exec(h || "");
  if (!m) return "rgba(0,0,0," + a + ")";
  const n = parseInt(m[1], 16);
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}
function applyStyle(){
  const r = document.documentElement.style;
  r.setProperty("--sub-scale", sty.size / 100);
  r.setProperty("--sub-lift", sty.lift + "px");
  r.setProperty("--sub-color", sty.color);
  r.setProperty("--sub-bg", hexRgba(sty.bg, sty.bga / 100));
  r.setProperty("--sub-radius", sty.shape);
  r.setProperty("--sub-font", sty.font);
  r.setProperty("--sub-weight", sty.weight);
  r.setProperty("--sub-shadow", EFFECTS[sty.effect] || "none");
  $("#vSize").textContent = sty.size + "%";
  $("#vLift").textContent = sty.lift + " px";
  $("#vBga").textContent = sty.bga + "%";
}
function syncControls(){
  for (const id in CTL) $("#" + id).value = sty[CTL[id]];
}
for (const id in CTL){
  const key = CTL[id];
  $("#" + id).addEventListener("input", e => {
    sty[key] = NUM.has(key) ? Number(e.target.value) : e.target.value;
    applyStyle(); lsSet("sub_style", JSON.stringify(sty));
  });
}
$("#sReset").addEventListener("click", () => {
  sty = Object.assign({}, STYLE_DEFAULT);
  syncControls(); applyStyle(); lsSet("sub_style", "");
});
syncControls(); applyStyle();

// ---------- buttons ----------
document.querySelectorAll(".tabs [data-view]").forEach(b => b.addEventListener("click", () => {
  setView(b.dataset.view); if (data) paintTable();
}));
$("#copy").addEventListener("click", () => { if (data) navigator.clipboard.writeText(data[view].map(l => l.text).join("\n")); });
function stamp(sec){
  const z = (n, w) => String(n).padStart(w, "0");
  return z(Math.floor(sec/3600), 2) + ":" + z(Math.floor(sec%3600/60), 2) + ":" + z(Math.floor(sec%60), 2) + ",000";
}
$("#srt").addEventListener("click", () => {
  if (!data) return;
  const all = data[view].filter(l => l.time), out = [];
  all.forEach((l, i) => {
    if (!l.text) return;
    const start = toSec(l.time);
    let end = i + 1 < all.length ? toSec(all[i + 1].time) : start + 4;
    if (end <= start) end = start + 2;
    out.push((out.length + 1) + "\n" + stamp(start) + " --> " + stamp(end) + "\n" + l.text + "\n");
  });
  const blob = new Blob([out.join("\n")], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "subtitles_" + view + ".srt"; a.click();
  URL.revokeObjectURL(a.href);
});
$("#saveToken").addEventListener("click", () => { lsSet("gh_token", $("#token").value.trim()); location.reload(); });
$("#clearToken").addEventListener("click", () => { lsSet("gh_token", ""); location.reload(); });

// ---------- start ----------
$("#source").textContent = CFG.repo && !CFG.repo.includes("YOUR-")
  ? "Loaded from GitHub: " + CFG.repo : (CFG.repo ? "" : "Loaded from this site");
loadList().then(route);
</script>
